[env:esp32-c5]
platform = espressif32
board = esp32-c5-devkitc-1
framework = arduino

; Board Hardware Overrides (ESP32-C5HF4 Mini)
board_build.mcu = esp32c5
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = custom_4Mb_full.csv

build_src_filter = ${env.build_src_filter} +<../boards/ESP32-C5>

build_flags =
	${env.build_flags}
	-Iboards/ESP32-C5
	-DDEVICE_NAME='"ESP32-C5 Mini"'
	
	; Native USB Serial CDC Configuration
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	
	-DCORE_DEBUG_LEVEL=1
	-DBAD_RX=4
	-DBAD_TX=5

	; Grove / I2C Pin Definitions
	-DGROVE_SDA=0  ; Default I2C SDA / RF TX pin
	-DGROVE_SCL=1  ; Default I2C SCL / IR/RF RX pin

	; IR LED Pins
	-DIR_TX_PINS='{{"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DIR_RX_PINS='{{"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DTXLED=27
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; Radio Frequency (One-pin modules)
	-DRF_TX_PINS='{{"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'
	-DRF_RX_PINS='{{"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}}'

	; SD Card Pins (-1 = Unused)
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; Display / TFT Variables
	-DROTATION=1
	-DBACKLIGHT=-1
	-DMINBRIGHT=160
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DSMOOTH_FONT=1
	-DTFT_DISPON=0x29
	-DTFT_DISPOFF=0x28
	-DTFT_CS=-1
	-DTFT_DC=-1
	-DTFT_RST=-1
	-DTOUCH_CS=-1
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_BL=-1

	; UI Text Sizes & Aliases
	-DFP=1
	-DFM=2
	-DFG=3
	-DBTN_ALIAS='"OK"'

	; CC1101 SPI Connection
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=-1
	-DCC1101_SS_PIN=SPI_SS_PIN
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN

	; Default SPI Pin Matrix (-1 for soft SPI or remapping)
	-DSPI_SCK_PIN=-1
	-DSPI_MOSI_PIN=-1
	-DSPI_MISO_PIN=-1
	-DSPI_SS_PIN=-1
